# OpenEvolve Configuration for MiniMax
# MiniMax-M3.1-Flash is the default; MiniMax-M3 is an optional ensemble member.
# Get your API key from: https://platform.minimax.io/
#
# Set your API key:
#   export MINIMAX_API_KEY="your-minimax-api-key"

# General settings
max_iterations: 100
checkpoint_interval: 10
log_level: "INFO"
random_seed: 42

# LLM configuration for MiniMax
llm:
  api_base: "https://api.minimax.io/v1"
  # For mainland China, use https://api.minimaxi.com/v1 with a regional API key.
  api_key: "${MINIMAX_API_KEY}"

  # Flash is selected by default. Increase M3's weight to include it in evolution.
  models:
    - name: "MiniMax-M3.1-Flash"
      weight: 1.0
    - name: "MiniMax-M3"
      weight: 0.0

  # MiniMax models for LLM feedback
  evaluator_models:
    - name: "MiniMax-M3.1-Flash"
      weight: 1.0

  # Generation parameters
  # Flash always thinks. Optional reasoning_effort: low, medium, high, xhigh, max.
  # Omit reasoning_effort to use the API default (max); M3 ignores this setting.
  # Both models accept temperature in [0, 2].
  temperature: 0.7
  top_p: 0.95
  max_tokens: 4096

  # Request parameters
  timeout: 120
  retries: 3
  retry_delay: 5

# Evolution settings
diff_based_evolution: true
max_code_length: 10000

# Prompt configuration
prompt:
  system_message: "You are an expert coder helping to improve programs through evolution."
  evaluator_system_message: "You are an expert code reviewer."
  num_top_programs: 3
  num_diverse_programs: 2
  use_template_stochasticity: true
  include_artifacts: true

# Database configuration
database:
  population_size: 1000
  num_islands: 5
  migration_interval: 50
  migration_rate: 0.1
  feature_dimensions:
    - "complexity"
    - "diversity"
  feature_bins: 10

# Evaluator configuration
evaluator:
  timeout: 300
  cascade_evaluation: true
  cascade_thresholds:
    - 0.5
    - 0.75
    - 0.9
  parallel_evaluations: 4
